apiVersion: 1
datasources:
  - name: Mimir tenant A
    uid: mimir-a
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST
      httpHeaderName1: X-Scope-OrgID
      timeInterval: 5s
    secureJsonData:
      httpHeaderValue1: tenant-a
  - name: Mimir tenant B
    uid: mimir-b
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    jsonData:
      httpMethod: POST
      httpHeaderName1: X-Scope-OrgID
      timeInterval: 5s
    secureJsonData:
      httpHeaderValue1: tenant-b
