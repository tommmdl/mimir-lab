global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    tenant_origin: a
remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: tenant-a
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: notes-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://notes-api.notes-lab.svc.cluster.local/healthz]
        labels: {endpoint: healthz}
      - targets: [http://notes-api.notes-lab.svc.cluster.local/readyz]
        labels: {endpoint: readyz}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
