multitenancy_enabled: true
usage_stats:
  enabled: false
ingest_storage:
  enabled: false
server:
  http_listen_port: 9009
  log_level: info
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
store_gateway:
  sharding_ring:
    replication_factor: 1
ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules
limits:
  compactor_blocks_retention_period: 24h
